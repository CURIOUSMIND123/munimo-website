<!DOCTYPE html>
<html lang="en">
<head>
<script src="demo-data.js"></script>
<script src="demo-backend.js"></script>
<script src="erp-web.js"></script>
<script src="table-sort.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loans</title>
<style>
  :root{--bg:#0b1220;--surface:#111a2b;--surface2:#0e1626;--border:rgba(255,255,255,.08);
    --text:#f1f5f9;--muted:#94a3b8;--faint:#64748b;--accent:#10b981;--accent2:#3b82f6;
    --owe:#f59e0b;--owed:#22d3ee;--red:#ef4444;--green:#22c55e;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;padding:18px;}
  .note{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.25);color:#bfdbfe;border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:14px;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 18px;}
  .tile .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .tile .v{font-size:26px;font-weight:800;margin-top:5px;}
  .tile.owe .v{color:var(--owe);} .tile.owed .v{color:var(--owed);}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .bar-row .grow{flex:1;}
  button{cursor:pointer;font-family:inherit;}
  .btn{background:var(--accent);color:#03130c;border:none;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;}
  .btn.alt{background:var(--accent2);color:#fff;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;}
  .seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:3px;}
  .seg button{border:none;background:none;color:var(--muted);padding:6px 12px;font-size:12px;font-weight:700;border-radius:7px;}
  .seg button.on{background:var(--accent);color:#03130c;}
  .seg.seg-wide{display:flex;width:100%;}
  .seg.seg-wide button{flex:1;text-align:center;}
  .loan{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;}
  .loan:hover{border-color:var(--accent);}
  .loan .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .loan .nm{font-size:16px;font-weight:700;}
  .loan .pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:8px;vertical-align:middle;}
  .pill.owe{background:rgba(245,158,11,.15);color:var(--owe);} .pill.owed{background:rgba(34,211,238,.15);color:var(--owed);}
  .loan .out{font-size:20px;font-weight:800;white-space:nowrap;}
  .loan.lia .out{color:var(--owe);} .loan.ast .out{color:var(--owed);}
  .loan .sub{font-size:12px;color:var(--muted);margin-top:4px;}
  .loan .bar{height:6px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;margin-top:9px;}
  .loan .bar>i{display:block;height:100%;}
  .loan.lia .bar>i{background:var(--owe);} .loan.ast .bar>i{background:var(--owed);}
  .loan .acts{margin-top:11px;display:flex;gap:8px;}
  .loan .acts button{font-size:12px;padding:7px 12px;border-radius:8px;font-weight:700;border:1px solid var(--border);background:var(--surface2);color:var(--text);}
  .loan .acts .pay{background:var(--accent);color:#03130c;border:none;}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;}
  .empty .e{font-size:40px;}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(2,6,18,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal.show{display:flex;}
  .sheet{background:var(--surface);border:1px solid var(--border);width:100%;max-width:440px;border-radius:16px;padding:20px;max-height:92vh;overflow:auto;}
  .sheet h3{margin:0 0 12px;font-size:18px;}
  .sheet .x{float:right;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;}
  label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:12px 1px 5px;text-transform:uppercase;letter-spacing:.3px;}
  input,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px;font-size:15px;background:var(--surface2);color:var(--text);font-family:inherit;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  .calc{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px;margin-top:14px;font-size:13px;color:var(--muted);}
  .btn-save{width:100%;background:var(--accent);color:#03130c;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;margin-top:18px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:8px 6px;border-bottom:1px solid var(--border);}
  td{padding:9px 6px;border-bottom:1px solid var(--border);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#020617;border:1px solid var(--border);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:90;}
  .toast.show{opacity:1;} .toast.err{border-color:var(--red);color:#fecaca;}
  @media(max-width:640px){.tiles{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="note">💡 Each loan is a live account. Record a loan and it’s created here; when you pay an EMI / repay, pick the loan and its outstanding goes down automatically. Tap any loan to see its full ledger.</div>

<div class="tiles">
  <div class="tile owe"><div class="l">Total we owe</div><div class="v" id="tOwe">₹0</div></div>
  <div class="tile owed"><div class="l">Total owed to us</div><div class="v" id="tOwed">₹0</div></div>
</div>

<div class="bar-row">
  <div class="seg" id="filt"><button data-f="all" class="on">All</button><button data-f="liability">We owe</button><button data-f="asset">Owed to us</button></div>
  <div class="grow"></div>
  <button class="btn alt" id="repayBtn">– Repay / EMI</button>
  <button class="btn" id="newBtn">＋ New loan</button>
</div>

<div id="list"><div class="empty"><div class="e">🏦</div>Loading…</div></div>

<!-- new loan -->
<div class="modal" id="newModal">
  <div class="sheet">
    <span class="x" id="newX">&times;</span>
    <h3>New loan</h3>
    <label>Type</label>
    <div class="seg seg-wide" id="newType"><button data-k="liability" class="on">We received (we owe)</button><button data-k="asset">We gave (owed to us)</button></div>
    <label>Party (lender / borrower)</label>
    <input id="nParty" placeholder="e.g. Niptu Paul, Salim Bhai, friend, partner" autocomplete="off">
    <label>Amount (₹) <span style="color:var(--faint);font-weight:400;">— optional, leave blank to just create the account</span></label>
    <input id="nAmt" type="number" inputmode="decimal" min="0" placeholder="0">
    <label>Into / from account</label>
    <select id="nAcct"></select>
    <label>Date</label>
    <input id="nDate" type="date">
    <label>Note (optional)</label>
    <input id="nNote" placeholder="e.g. hand loan, business partner" autocomplete="off">
    <button class="btn-save" id="nSave">Create loan</button>
  </div>
</div>

<!-- repay / collect -->
<div class="modal" id="payModal">
  <div class="sheet">
    <span class="x" id="payX">&times;</span>
    <h3 id="payTitle">Repay / EMI</h3>
    <label>Loan</label>
    <select id="pLoan"></select>
    <label>Amount (₹)</label>
    <input id="pAmt" type="number" inputmode="decimal" min="0" placeholder="0">
    <label id="pAcctLbl">From account</label>
    <select id="pAcct"></select>
    <label>Date</label>
    <input id="pDate" type="date">
    <label>Note (optional)</label>
    <input id="pNote" placeholder="e.g. EMI, part payment" autocomplete="off">
    <div class="calc" id="pCalc"></div>
    <button class="btn-save" id="pSave">Save</button>
  </div>
</div>

<!-- ledger -->
<div class="modal" id="ledModal">
  <div class="sheet" style="max-width:560px;">
    <span class="x" id="ledX">&times;</span>
    <h3 id="ledTitle">Loan ledger</h3>
    <div id="ledBody"><div class="empty">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';
  var E=window.erp, S={accounts:[],loans:[],filt:'all',newKind:'liability'};
  function $(i){return document.getElementById(i);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  function inr(n){n=Math.round((Number(n)||0)*100)/100;return '₹'+n.toLocaleString('en-IN',{maximumFractionDigits:2});}
  function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var tT;function toast(m,e){var t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(tT);tT=setTimeout(()=>t.className='toast',2600);}

  function loadAccounts(cb){E.getBanks().then(r=>{S.accounts=(r&&r.success&&r.data)?r.data:[];
    var html=S.accounts.map(a=>'<option value="'+a.id+'">'+esc(a.account_name)+'</option>').join('');
    $('nAcct').innerHTML=html; $('pAcct').innerHTML=html; if(cb)cb();});}

  function load(){
    E.getLoans().then(r=>{
      if(!r||!r.success){toast((r&&r.error)||'Could not load',true);return;}
      S.loans=r.data.loans||[];
      $('tOwe').textContent=inr(r.data.totals.we_owe);
      $('tOwed').textContent=inr(r.data.totals.owed_to_us);
      render();
      // populate repay dropdown
      $('pLoan').innerHTML=S.loans.map(l=>'<option value="'+esc(l.name)+'" data-kind="'+l.kind+'">'+esc(l.party)+' ('+(l.kind==='liability'?'we owe ':'owed ')+inr(l.outstanding)+')</option>').join('');
    });
  }
  function render(){
    var rows=S.loans.filter(l=>S.filt==='all'||l.kind===S.filt);
    if(!rows.length){$('list').innerHTML='<div class="empty"><div class="e">🏦</div>No loans yet. Tap ＋ New loan to add one.</div>';return;}
    var maxOut=Math.max.apply(null,rows.map(l=>Math.abs(l.outstanding)).concat([1]));
    $('list').innerHTML=rows.map(l=>{
      var lia=l.kind==='liability';
      var pct=Math.round(Math.abs(l.outstanding)/maxOut*100);
      var sub=lia? (inr(l.principal_in)+' received · '+inr(l.paid_back)+' repaid') : (inr(l.principal_in)+' given · '+inr(l.paid_back)+' got back');
      return '<div class="loan '+(lia?'lia':'ast')+'" data-led="'+esc(l.name)+'">'+
        '<div class="top"><div><span class="nm">'+esc(l.party)+'</span><span class="pill '+(lia?'owe':'owed')+'">'+(lia?'WE OWE':'OWED TO US')+'</span></div>'+
        '<div class="out">'+inr(l.outstanding)+'</div></div>'+
        '<div class="sub">'+sub+' · '+(l.count||0)+' entries</div>'+
        '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
        '<div class="acts"><button class="pay" data-pay="'+esc(l.name)+'" data-kind="'+l.kind+'">'+(lia?'Repay / EMI':'Collect')+'</button>'+
        '<button data-led2="'+esc(l.name)+'">View ledger</button></div></div>';
    }).join('');
  }
  $('list').addEventListener('click',e=>{
    var pay=e.target.closest('[data-pay]'); if(pay){e.stopPropagation();openPay(pay.getAttribute('data-pay'),pay.getAttribute('data-kind'));return;}
    var l=e.target.closest('[data-led],[data-led2]'); if(l)openLedger(l.getAttribute('data-led')||l.getAttribute('data-led2'));
  });
  $('filt').addEventListener('click',e=>{var b=e.target.closest('button');if(!b)return;S.filt=b.getAttribute('data-f');
    $('filt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render();});

  // ── new loan ──
  $('newType').addEventListener('click',e=>{var b=e.target.closest('button');if(!b)return;S.newKind=b.getAttribute('data-k');
    $('newType').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  $('newBtn').addEventListener('click',()=>{loadAccounts();$('nParty').value='';$('nAmt').value='';$('nNote').value='';$('nDate').value=today();
    S.newKind='liability';$('newType').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.getAttribute('data-k')==='liability'));
    $('newModal').classList.add('show');});
  $('newX').addEventListener('click',()=>$('newModal').classList.remove('show'));
  $('nSave').addEventListener('click',()=>{
    var party=$('nParty').value.trim();if(!party){toast('Enter the party name',true);return;}
    // Amount is OPTIONAL: leave it blank to just create the loan account, or
    // enter it to also record the money received/given right now.
    var amt=parseFloat($('nAmt').value)||0;
    var acct=$('nAcct').value;
    var name=(S.newKind==='asset'?'Loan Given: ':'Loan: ')+party;
    $('nSave').disabled=true;
    E.saveCashHead({name:name,kind:S.newKind}).then(hr=>{
      if(hr&&hr.success===false){$('nSave').disabled=false;toast(hr.error||'Could not create',true);return;}
      if(!(amt>0)){ // account-only: created, no money movement yet
        $('nSave').disabled=false;toast('Loan account created');$('newModal').classList.remove('show');load();return;
      }
      if(!acct){$('nSave').disabled=false;toast('Pick an account for the amount',true);return;}
      // received(liability)=money in(credit); given(asset)=money out(debit)
      E.saveTransaction({txn_date:$('nDate').value||today(),type:S.newKind==='asset'?'debit':'credit',category:name,
        amount:amt,bank_account_id:parseInt(acct,10),description:$('nNote').value.trim()||(S.newKind==='asset'?'Loan given':'Loan received'),
        payment_mode:'bank'}).then(r=>{$('nSave').disabled=false;
        if(r&&r.success){toast('Loan created');$('newModal').classList.remove('show');load();}
        else toast((r&&r.error)||'Could not save',true);});
    });
  });

  // ── repay / collect ──
  function openPay(loanName,kind){
    loadAccounts();
    $('payTitle').textContent = kind==='asset' ? 'Collect repayment' : 'Repay / EMI';
    $('pAcctLbl').textContent = kind==='asset' ? 'Into account' : 'From account';
    $('pAmt').value='';$('pNote').value='';$('pDate').value=today();$('pCalc').textContent='';
    if(loanName){ for(var o of $('pLoan').options){ if(o.value===loanName){$('pLoan').value=loanName;break;} } }
    $('payModal').classList.add('show'); payCalc();
  }
  $('repayBtn').addEventListener('click',()=>{ if(!S.loans.length){toast('Add a loan first',true);return;} openPay($('pLoan').value, ($('pLoan').selectedOptions[0]||{}).dataset?($('pLoan').selectedOptions[0].dataset.kind):'liability'); });
  $('payX').addEventListener('click',()=>$('payModal').classList.remove('show'));
  $('pLoan').addEventListener('change',payCalc);
  $('pAmt').addEventListener('input',payCalc);
  function payCalc(){
    var o=$('pLoan').selectedOptions[0]; if(!o){$('pCalc').textContent='';return;}
    var l=S.loans.find(x=>x.name===o.value); if(!l)return;
    var amt=parseFloat($('pAmt').value)||0;
    var after=l.kind==='liability'? l.outstanding-amt : l.outstanding-amt;
    $('pCalc').innerHTML='Current outstanding: <b>'+inr(l.outstanding)+'</b> → after this: <b style="color:'+(after<=0?'#22c55e':'var(--text)')+'">'+inr(after<0?0:after)+(after<0?' (overpaid '+inr(-after)+')':'')+'</b>';
  }
  $('pSave').addEventListener('click',()=>{
    var o=$('pLoan').selectedOptions[0]; if(!o){toast('Pick a loan',true);return;}
    var l=S.loans.find(x=>x.name===o.value);
    var amt=parseFloat($('pAmt').value);if(!(amt>0)){toast('Enter the amount',true);return;}
    var acct=$('pAcct').value;if(!acct){toast('Pick an account',true);return;}
    // liability repay = money out (debit); asset collect = money in (credit)
    $('pSave').disabled=true;
    E.saveTransaction({txn_date:$('pDate').value||today(),type:l.kind==='liability'?'debit':'credit',category:l.name,
      amount:amt,bank_account_id:parseInt(acct,10),description:$('pNote').value.trim()||(l.kind==='liability'?'EMI / repayment':'Repayment received'),
      payment_mode:'bank'}).then(r=>{$('pSave').disabled=false;
      if(r&&r.success){toast('Saved · '+esc(l.party)+' updated');$('payModal').classList.remove('show');load();}
      else toast((r&&r.error)||'Could not save',true);});
  });

  // ── ledger ──
  function openLedger(loanName){
    var l=S.loans.find(x=>x.name===loanName)||{party:loanName,kind:'liability'};
    $('ledTitle').textContent=l.party+' — loan ledger';
    $('ledBody').innerHTML='<div class="empty">Loading…</div>';
    $('ledModal').classList.add('show');
    E.getTransactions({category:loanName}).then(r=>{
      var rows=(r&&r.success&&r.data)?r.data.filter(t=>t.type==='credit'||t.type==='debit'):[];
      rows.sort((a,b)=>a.txn_date<b.txn_date?-1:a.txn_date>b.txn_date?1:(a.id-b.id));
      var lia=l.kind==='liability', run=0;
      var body=rows.map(t=>{
        // liability outstanding: +credit -debit ; asset: +debit -credit
        run += lia ? (t.type==='credit'?t.amount:-t.amount) : (t.type==='debit'?t.amount:-t.amount);
        var inLbl = lia? (t.type==='credit'?'received':'repaid') : (t.type==='debit'?'given':'got back');
        return '<tr><td>'+esc(t.txn_date)+'<div style="color:var(--muted);font-size:11px;">'+esc(t.description||'')+(t.bank_name?' · '+esc(t.bank_name):'')+'</div></td>'+
          '<td style="color:var(--muted);font-size:11px;">'+inLbl+'</td>'+
          '<td class="num">'+inr(t.amount)+'</td><td class="num"><b>'+inr(run)+'</b></td></tr>';
      }).join('');
      if(!rows.length){$('ledBody').innerHTML='<div class="empty">No entries yet.</div>';return;}
      $('ledBody').innerHTML='<table><thead><tr><th>Date / note</th><th></th><th class="num">Amount</th><th class="num">Outstanding</th></tr></thead><tbody>'+body+'</tbody></table>';
    });
  }
  $('ledX').addEventListener('click',()=>$('ledModal').classList.remove('show'));
  [ 'newModal','payModal','ledModal' ].forEach(id=>$(id).addEventListener('click',e=>{if(e.target===$(id))$(id).classList.remove('show');}));

  $('nDate').value=today();$('pDate').value=today();
  loadAccounts(); load();
  window.refreshPage=load;
})();
</script>
</body>
</html>
